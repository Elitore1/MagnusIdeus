name: Esclarificador CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests through the project wrapper
        run: ./run.sh --ci test

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esclarificador-logs
          path: output/logs.txt
          if-no-files-found: ignore
